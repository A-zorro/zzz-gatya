<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Chat Assistant</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
        "Hiragino Sans", "Yu Gothic", sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    #app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* ============================================================
       ヘッダー
    ============================================================ */

    #header {
      flex-shrink: 0;
      padding: 12px 16px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
      font-weight: bold;
    }

    /* ============================================================
       チャット表示領域
    ============================================================ */

    #chatArea {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .message {
      margin-bottom: 12px;
      max-width: 85%;
      padding: 10px 13px;
      border-radius: 12px;
      white-space: pre-wrap;
      overflow-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      background: #dbeafe;
    }

    .message.assistant {
      margin-right: auto;
      background: #ffffff;
      border: 1px solid #e0e0e0;
    }

    /* ============================================================
       入力エリア
    ============================================================ */

    #inputArea {
      flex-shrink: 0;
      display: flex;
      gap: 8px;
      padding: 10px;
      background: #ffffff;
      border-top: 1px solid #ddd;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      resize: none;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font: inherit;
      line-height: 1.4;
    }

    #sendButton {
      flex-shrink: 0;
      padding: 0 16px;
      border: none;
      border-radius: 10px;
      background: #222;
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    #sendButton:disabled {
      opacity: 0.5;
      cursor: default;
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- ============================================================
         ヘッダー
    ============================================================ -->

    <header id="header">
      Chat Assistant
    </header>

    <!-- ============================================================
         チャット表示
         実際のメッセージは ui.js が生成する
    ============================================================ -->

    <main id="chatArea"></main>

    <!-- ============================================================
         入力
         送信処理は app.js / chat.js が担当する
    ============================================================ -->

    <form id="inputArea">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="メッセージを入力..."
        autocomplete="off"
      ></textarea>

      <button id="sendButton" type="submit">
        送信
      </button>
    </form>

  </div>

  <!-- ============================================================
       JavaScript
       
       【重要】
       現段階では各ファイルの中身が未実装でも読み込み順だけ確定させる。
       後から各ファイルを順番に実装していく。

       依存関係:
       config.js
          ↓
       ui.js / chat.js / command.js / actions.js
          ↓
       app.js
   ============================================================ -->

  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="chat.js"></script>
  <script src="command.js"></script>
  <script src="actions.js"></script>
  <script src="app.js"></script>

</body>
</html>
